name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Re-evaluate the release candidate whenever a GitOps reconcile finishes:
  # apply completion is the event that unblocks a waiting release PR, since
  # applies never push to main themselves.
  workflow_run:
    workflows: ["Protected GitOps"]
    types: [completed]

concurrency:
  group: release-please
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  release-please:
    name: Automated Semantic Release
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Resolve GitHub App ID
        if: env.HAS_PEM == 'true'
        id: resolve-app-id
        env:
          HAS_PEM: ${{ secrets.GOVERNANCE_PEM != '' }}
        run: |
          APP_ID="${{ vars.RELEASE_APP_ID }}"
          if [ -z "$APP_ID" ]; then
            APP_ID=$(jq -r '.appId' profile.json)
          fi
          echo "app_id=$APP_ID" >> "$GITHUB_OUTPUT"

      - name: Generate GitHub App Token
        if: env.HAS_PEM == 'true'
        uses: actions/create-github-app-token@v2
        id: app-token
        env:
          HAS_PEM: ${{ secrets.GOVERNANCE_PEM != '' }}
        with:
          app-id: ${{ steps.resolve-app-id.outputs.app_id }}
          private-key: ${{ secrets.GOVERNANCE_PEM }}

      - name: Run Release-Please
        uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Enable auto-merge on release PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
        run: |
          # Convergence gate: a release tag must snapshot applied state, so the
          # release PR is only handed to automerge once the most recent GitOps
          # reconcile on main has fully succeeded (no waiting/queued/failed run).
          LATEST=$(gh run list --workflow gitops.yml --branch main --limit 1 --json status,conclusion --jq '.[0] // empty')
          if [ -z "$LATEST" ]; then
            echo "::warning::No GitOps runs found; skipping auto-merge enablement."
            exit 0
          fi
          STATUS=$(printf '%s' "$LATEST" | jq -r .status)
          CONCLUSION=$(printf '%s' "$LATEST" | jq -r .conclusion)
          if [ "$STATUS" != "completed" ] || [ "$CONCLUSION" != "success" ]; then
            echo "GitOps not converged (latest run: $STATUS/$CONCLUSION); release PR stays open and retries on the next trigger."
            exit 0
          fi
          echo "GitOps converged (latest run: $STATUS/$CONCLUSION); enabling auto-merge."
          for pr in $(gh pr list --label "autorelease: pending" --state open --json number --jq '.[].number'); do
            if ! gh pr merge --auto --squash "$pr"; then
              echo "::warning::Auto-merge unavailable for PR #$pr — repo setting allow_auto_merge is applied via Terraform; retry happens on the next push to main."
            fi
          done
