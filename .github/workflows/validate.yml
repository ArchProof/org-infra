name: GitOps validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: gitops-validate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu-version: 1.12.0

      - name: Check OpenTofu formatting
        run: tofu fmt -check -recursive

      - name: OpenTofu Init (No backend)
        run: tofu init -backend=false -lockfile=readonly

      - name: Validate schema with synthetic non-credentials
        run: tofu validate
        env:
          GITHUB_APP_ID: '1'
          GITHUB_APP_INSTALLATION_ID: '1'
          GITHUB_APP_PEM_FILE: synthetic-validation-only

      - name: Verify Documentation (terraform-docs)
        uses: terraform-docs/gh-actions@v1.4.1
        with:
          working-dir: .
          config-file: .terraform-docs.yml
          fail-on-diff: true
