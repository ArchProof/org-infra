name: GitOps validation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    name: gitops-validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.16.0'
      - run: bash tooling/install-ci.sh
      - run: npm --prefix tooling ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix tooling test
      - run: node tooling/cli.mjs validate
      - run: tofu fmt -check -recursive
      - run: tofu init -backend=false -lockfile=readonly
      - name: Validate schema with synthetic non-credentials
        run: tofu validate
        env:
          GITHUB_APP_ID: '1'
          GITHUB_APP_INSTALLATION_ID: '1'
          GITHUB_APP_PEM_FILE: synthetic-validation-only
      - run: tofu test
      - run: tflint --init && tflint
