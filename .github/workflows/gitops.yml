name: Protected GitOps

on:
  workflow_dispatch:
    inputs:
      action:
        type: choice
        description: OpenTofu Action
        options: [plan, apply]
        required: true
      reviewed_sha:
        description: Exact current merged main SHA reviewed by the environment approver
        required: true
  schedule:
    - cron: '23 6 * * *' # Daily drift check

permissions:
  contents: read

concurrency:
  group: archproof-github-state
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.ref == 'refs/heads/main'
    environment: gitops
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify reviewed revision
        env:
          REVIEWED_SHA: ${{ inputs.reviewed_sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != schedule ]; then
            test "$REVIEWED_SHA" = "$GITHUB_SHA"
          fi

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu-version: 1.12.0

      - name: Reconcile GitOps State
        env:
          ACTION: ${{ inputs.action || 'plan' }}
          GOVERNANCE_PEM: ${{ secrets.GOVERNANCE_PEM }}
          STATE_ACCESS_KEY: ${{ secrets.STATE_ACCESS_KEY }}
          STATE_SECRET_KEY: ${{ secrets.STATE_SECRET_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          export GITHUB_APP_PEM_FILE="$RUNNER_TEMP/governance.pem"
          printf '%s' "$GOVERNANCE_PEM" > "$GITHUB_APP_PEM_FILE"
          unset GOVERNANCE_PEM
          trap 'rm -f "$GITHUB_APP_PEM_FILE"' EXIT

          export GITHUB_APP_ID=$(jq -r .appId profile.json)
          export GITHUB_APP_INSTALLATION_ID=$(jq -r .installationId profile.json)
          BUCKET=$(jq -r .state.bucket profile.json)
          KEY=$(jq -r .state.key profile.json)
          REGION=$(jq -r .state.region profile.json)
          ENDPOINT=$(jq -r .state.endpoint profile.json)

          tofu init \
            -backend-config="bucket=$BUCKET" \
            -backend-config="key=$KEY" \
            -backend-config="region=$REGION" \
            -backend-config="endpoint=$ENDPOINT" \
            -backend-config="access_key=$STATE_ACCESS_KEY" \
            -backend-config="secret_key=$STATE_SECRET_KEY"

          if [ "$ACTION" = "plan" ] || [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            tofu plan -no-color -out="$RUNNER_TEMP/plan.tfplan"
          elif [ "$ACTION" = "apply" ]; then
            tofu apply -auto-approve -no-color
          fi
