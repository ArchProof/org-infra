name: Protected GitOps

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * *' # Daily drift check

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: archproof-github-state
  cancel-in-progress: false

jobs:
  plan:
    name: Speculative OpenTofu Plan
    if: github.ref == 'refs/heads/main'
    environment: gitops-plan
    runs-on: ubuntu-24.04
    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.12.0
          tofu_wrapper: false

      - name: Cache OpenTofu Plugins
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/plugin-cache
          key: ${{ runner.os }}-opentofu-${{ hashFiles('**/.terraform.lock.hcl') }}

      - name: Extract Environment from Profile
        id: profile
        env:
          STATE_ENDPOINT: ${{ secrets.STATE_ENDPOINT }}
          STATE_BUCKET: ${{ secrets.STATE_BUCKET }}
        run: |
          echo "GITHUB_APP_ID=$(jq -r .appId profile.json)" >> "$GITHUB_ENV"
          echo "GITHUB_APP_INSTALLATION_ID=$(jq -r .installationId profile.json)" >> "$GITHUB_ENV"
          echo "TF_VAR_reviewer_ids=$(jq -c '[.reviewers[].id]' profile.json)" >> "$GITHUB_ENV"
          echo "TF_VAR_single_owner=$(jq -r .singleOwner profile.json)" >> "$GITHUB_ENV"

          # Generate OpenTofu S3 backend configuration matching archproof spec
          jq --arg ep "$STATE_ENDPOINT" --arg b "$STATE_BUCKET" '{
            bucket: (if .state.bucket then .state.bucket else $b end),
            key: .state.key,
            region: .state.region,
            endpoints: { s3: (if .state.endpoint then .state.endpoint else $ep end) },
            use_path_style: true,
            use_lockfile: true,
            skip_credentials_validation: true,
            skip_region_validation: true,
            skip_metadata_api_check: true,
            skip_requesting_account_id: true,
            skip_s3_checksum: true
          }' profile.json > "${{ runner.temp }}/backend.json"

          # Ensure healthy state storage endpoint resolution (guards against transient AWS ELB node failures)
          HOST_PIN=$(node -e '
            const dns = require("dns");
            const https = require("https");
            const fs = require("fs");
            const profile = JSON.parse(fs.readFileSync("profile.json", "utf8"));
            const ep = process.env.STATE_ENDPOINT || (profile.state && profile.state.endpoint);
            if (ep) {
              const u = new URL(ep);
              const host = u.hostname;
              dns.lookup(host, { all: true, family: 4 }, (err, addresses) => {
                if (err || !addresses || addresses.length <= 1) process.exit(0);
                let checked = 0;
                addresses.forEach(({ address: ip }) => {
                  const req = https.request({
                    host: ip,
                    port: u.port || 443,
                    path: "/",
                    method: "GET",
                    servername: host,
                    headers: { Host: host },
                    rejectUnauthorized: false,
                    timeout: 2500
                  }, res => {
                    if (res.statusCode !== 500 && res.statusCode !== 0) {
                      console.log(`${ip} ${host}`);
                      process.exit(0);
                    }
                    checked++;
                    if (checked === addresses.length) process.exit(0);
                  });
                  req.on("error", () => {
                    checked++;
                    if (checked === addresses.length) process.exit(0);
                  });
                  req.end();
                });
              });
            }
          ' 2>/dev/null || true)
          if [ -n "$HOST_PIN" ]; then
            echo "State endpoint health resolution: $HOST_PIN"
            echo "$HOST_PIN" | sudo tee -a /etc/hosts
          fi

      - name: OpenTofu Init
        id: init
        env:
          TF_PLUGIN_CACHE_DIR: ${{ runner.temp }}/plugin-cache
          AWS_ACCESS_KEY_ID: ${{ secrets.STATE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.STATE_SECRET_KEY }}
          AWS_EC2_METADATA_DISABLED: "true"
        run: |
          mkdir -p "${{ runner.temp }}/plugin-cache"
          export AWS_ACCESS_KEY_ID="$(printf '%s' "$AWS_ACCESS_KEY_ID" | tr -d '\r\n[:space:]')"
          export AWS_SECRET_ACCESS_KEY="$(printf '%s' "$AWS_SECRET_ACCESS_KEY" | tr -d '\r\n[:space:]')"
          tofu init -input=false -backend-config="${{ runner.temp }}/backend.json"

      - name: OpenTofu Plan
        id: plan
        env:
          GITHUB_APP_PEM_FILE: ${{ secrets.GOVERNANCE_PEM }}
          AWS_ACCESS_KEY_ID: ${{ secrets.STATE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.STATE_SECRET_KEY }}
          AWS_EC2_METADATA_DISABLED: "true"
        run: |
          export AWS_ACCESS_KEY_ID="$(printf '%s' "$AWS_ACCESS_KEY_ID" | tr -d '\r\n[:space:]')"
          export AWS_SECRET_ACCESS_KEY="$(printf '%s' "$AWS_SECRET_ACCESS_KEY" | tr -d '\r\n[:space:]')"
          set +e
          tofu plan -detailed-exitcode -no-color -lock-timeout=60s -out="${{ runner.temp }}/plan.tfplan"
          EXITCODE=$?
          tofu show -no-color "${{ runner.temp }}/plan.tfplan" > "${{ runner.temp }}/plan.txt"
          
          # Render plan to Step Summary
          echo "## 📖 OpenTofu Plan Result" >> $GITHUB_STEP_SUMMARY
          if [ $EXITCODE -eq 0 ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "✅ **No changes.** Infrastructure matches Git configuration." >> $GITHUB_STEP_SUMMARY
          elif [ $EXITCODE -eq 2 ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "⚠️ **Changes detected.** Review the plan below before approving deployment." >> $GITHUB_STEP_SUMMARY
            echo "<details open><summary>Click to view plan diff</summary>" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```hcl' >> $GITHUB_STEP_SUMMARY
            head -c 50000 "${{ runner.temp }}/plan.txt" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "</details>" >> $GITHUB_STEP_SUMMARY
          elif [ $EXITCODE -eq 1 ]; then
            echo "::error::OpenTofu plan failed with an error."
            exit 1
          fi
          exit 0

      - name: Upload Reviewed Plan Artifact
        if: steps.plan.outputs.has_changes == 'true' && github.event_name != 'schedule'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ github.sha }}
          path: ${{ runner.temp }}/plan.tfplan
          retention-days: 1

      - name: Generate Drift Report
        if: github.event_name == 'schedule' && steps.plan.outputs.has_changes == 'true'
        run: |
          mkdir -p evidence/drift
          cat << 'EOF' > evidence/drift/drift-report.md
          # ⚠️ Infrastructure Drift Detected

          An OpenTofu drift check executed on schedule has detected divergence between real-world infrastructure and Git declarations.

          - Run ID: ${{ github.run_id }}
          - Timestamp: $(date -u +"%Y-%m-%dT%H:%M:%SZ")
          - Commit SHA: ${{ github.sha }}

          ## Plan Diff
          EOF
          cat "${{ runner.temp }}/plan.txt" >> evidence/drift/drift-report.md

      - name: Create Pull Request on Drift
        if: github.event_name == 'schedule' && steps.plan.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ github.token }}
          branch: gitops/drift-alert
          title: "⚠️ Infrastructure Drift Detected [$(date +'%Y-%m-%d')]"
          commit-message: "chore(gitops): record infrastructure drift report"
          body: |
            ### OpenTofu Scheduled Drift Alert
            Drift was detected during the daily scheduled GitOps check.

            [View Workflow Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

  apply:
    name: Protected OpenTofu Apply
    needs: plan
    if: github.event_name != 'schedule' && needs.plan.outputs.has_changes == 'true'
    environment: gitops
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.12.0
          tofu_wrapper: false

      - name: Cache OpenTofu Plugins
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/plugin-cache
          key: ${{ runner.os }}-opentofu-${{ hashFiles('**/.terraform.lock.hcl') }}

      - name: Extract Environment from Profile
        id: profile
        env:
          STATE_ENDPOINT: ${{ secrets.STATE_ENDPOINT }}
          STATE_BUCKET: ${{ secrets.STATE_BUCKET }}
        run: |
          echo "GITHUB_APP_ID=$(jq -r .appId profile.json)" >> "$GITHUB_ENV"
          echo "GITHUB_APP_INSTALLATION_ID=$(jq -r .installationId profile.json)" >> "$GITHUB_ENV"
          echo "TF_VAR_reviewer_ids=$(jq -c '[.reviewers[].id]' profile.json)" >> "$GITHUB_ENV"
          echo "TF_VAR_single_owner=$(jq -r .singleOwner profile.json)" >> "$GITHUB_ENV"

          # Generate OpenTofu S3 backend configuration matching archproof spec
          jq --arg ep "$STATE_ENDPOINT" --arg b "$STATE_BUCKET" '{
            bucket: (if .state.bucket then .state.bucket else $b end),
            key: .state.key,
            region: .state.region,
            endpoints: { s3: (if .state.endpoint then .state.endpoint else $ep end) },
            use_path_style: true,
            use_lockfile: true,
            skip_credentials_validation: true,
            skip_region_validation: true,
            skip_metadata_api_check: true,
            skip_requesting_account_id: true,
            skip_s3_checksum: true
          }' profile.json > "${{ runner.temp }}/backend.json"

          # Ensure healthy state storage endpoint resolution (guards against transient AWS ELB node failures)
          HOST_PIN=$(node -e '
            const dns = require("dns");
            const https = require("https");
            const fs = require("fs");
            const profile = JSON.parse(fs.readFileSync("profile.json", "utf8"));
            const ep = process.env.STATE_ENDPOINT || (profile.state && profile.state.endpoint);
            if (ep) {
              const u = new URL(ep);
              const host = u.hostname;
              dns.lookup(host, { all: true, family: 4 }, (err, addresses) => {
                if (err || !addresses || addresses.length <= 1) process.exit(0);
                let checked = 0;
                addresses.forEach(({ address: ip }) => {
                  const req = https.request({
                    host: ip,
                    port: u.port || 443,
                    path: "/",
                    method: "GET",
                    servername: host,
                    headers: { Host: host },
                    rejectUnauthorized: false,
                    timeout: 2500
                  }, res => {
                    if (res.statusCode !== 500 && res.statusCode !== 0) {
                      console.log(`${ip} ${host}`);
                      process.exit(0);
                    }
                    checked++;
                    if (checked === addresses.length) process.exit(0);
                  });
                  req.on("error", () => {
                    checked++;
                    if (checked === addresses.length) process.exit(0);
                  });
                  req.end();
                });
              });
            }
          ' 2>/dev/null || true)
          if [ -n "$HOST_PIN" ]; then
            echo "State endpoint health resolution: $HOST_PIN"
            echo "$HOST_PIN" | sudo tee -a /etc/hosts
          fi

      - name: Download Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ github.sha }}
          path: ${{ runner.temp }}

      - name: OpenTofu Init
        id: init
        env:
          TF_PLUGIN_CACHE_DIR: ${{ runner.temp }}/plugin-cache
          AWS_ACCESS_KEY_ID: ${{ secrets.STATE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.STATE_SECRET_KEY }}
          AWS_EC2_METADATA_DISABLED: "true"
        run: |
          mkdir -p "${{ runner.temp }}/plugin-cache"
          export AWS_ACCESS_KEY_ID="$(printf '%s' "$AWS_ACCESS_KEY_ID" | tr -d '\r\n[:space:]')"
          export AWS_SECRET_ACCESS_KEY="$(printf '%s' "$AWS_SECRET_ACCESS_KEY" | tr -d '\r\n[:space:]')"
          tofu init -input=false -backend-config="${{ runner.temp }}/backend.json"

      - name: OpenTofu Apply
        env:
          GITHUB_APP_PEM_FILE: ${{ secrets.GOVERNANCE_PEM }}
          AWS_ACCESS_KEY_ID: ${{ secrets.STATE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.STATE_SECRET_KEY }}
          AWS_EC2_METADATA_DISABLED: "true"
        run: |
          export AWS_ACCESS_KEY_ID="$(printf '%s' "$AWS_ACCESS_KEY_ID" | tr -d '\r\n[:space:]')"
          export AWS_SECRET_ACCESS_KEY="$(printf '%s' "$AWS_SECRET_ACCESS_KEY" | tr -d '\r\n[:space:]')"
          # Applies strictly the exact pre-computed binary plan file reviewed by the human
          tofu apply -input=false -lock-timeout=60s "${{ runner.temp }}/plan.tfplan"

          echo "## 🚀 OpenTofu Apply Succeeded" >> $GITHUB_STEP_SUMMARY
          echo "The reviewed plan was successfully applied to production infrastructure." >> $GITHUB_STEP_SUMMARY
